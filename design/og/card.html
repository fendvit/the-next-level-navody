<!doctype html>
<!--
  Source of public/og.png — the 1200x630 card Facebook, LinkedIn, Twitter/X,
  WhatsApp, Slack and iMessage show when navody.tnextlvl.com is shared.

  v4.1 (2026-10-14), the newsletter site's card language: paper ground,
  Inter Tight in sentence case, the emphasised phrase in the brand blue
  with the full stop in ink, a small label line. Flat type and no photo on
  purpose — it keeps this card a small PNG (the newsletter card carries a
  photo and is a JPEG for that reason). No guide count either: it changes
  every time a guide is added, and this raster would go stale.

  Inter Tight loads from Google Fonts, so the render needs network access.
  Regenerate:  node design/og/build.mjs

  Every value below is lifted from src/design-system.css. It is duplicated
  rather than imported because this file is opened directly off disk by a
  browser with no build step — so if the tokens move, they move here too.
-->
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&display=block&subset=latin-ext"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      :root {
        --paper: #f5f6f8;
        --ink: #10131a;
        --ink-muted: #505968;
        --brand: #2f4f9e;
      }

      html, body { margin: 0; padding: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Inter Tight", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 56px 64px;
      }

      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.035em;
      }

      .wordmark svg {
        width: 27px;
        height: 27px;
        fill: none;
        stroke: currentColor;
        stroke-width: 6;
      }

      /* Line breaks set by hand: the card is always exactly 1200px wide and
         the copy is fixed, so letting it wrap would only risk a widow. */
      h1 {
        margin: 0;
        font-size: 80px;
        line-height: 0.96;
        letter-spacing: -0.045em;
        font-weight: 700;
      }

      .hl { color: var(--brand); }

      .strip {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 22px;
        font-weight: 500;
        color: var(--ink-muted);
      }

      .strip .rule {
        width: 40px;
        height: 1px;
        background: var(--ink-muted);
      }
    </style>
  </head>

  <body>
    <div class="card">
      <span class="wordmark">
        <!-- The newsletter site's components/Brand.tsx <Mark>. -->
        <svg viewBox="0 0 48 48"><path d="M8 8H40V40" /><path d="M40 8L17.37 30.63" /></svg>
        The Next Level
      </span>

      <h1>
        Všechno, co jsem kdy natočil,<br />
        <span class="hl">na jednom místě</span>.
      </h1>

      <div class="strip">
        <span class="rule"></span>
        <span>Knihovna návodů · zdarma a bez registrace</span>
      </div>
    </div>
  </body>
</html>
