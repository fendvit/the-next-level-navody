<!--
  Favicon: the brand arrow on an accent tile. Byte for byte the same mark as
  the newsletter site's app/icon.svg, so a tab reads as THE NEXT LEVEL
  whichever half of the brand it belongs to. Change one, change both.

  Replaced an open-book glyph on 2026-09-19: the header here carries the
  arrow, so the tab and the page were showing two different logos.

  No two hyphens in a row anywhere in this comment. XML forbids it, and an
  SVG favicon that fails to parse still serves 200 while rendering nothing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#2f56c8" />
  <g
    transform="translate(14 14) scale(0.72)"
    fill="none"
    stroke="#f2f0ea"
    stroke-width="11"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  >
    <path d="M 7 93 L 87 13" />
    <path d="M 14 8 L 92 8 L 92 88" />
  </g>
</svg>
