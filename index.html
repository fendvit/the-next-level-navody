<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches --paper in the shared design system. -->
    <meta name="theme-color" content="#f5f6f8" />

    <title>Návody — THE NEXT LEVEL</title>
    <meta name="description" content="Kompletní knihovna návodů a rad od @vitekfendrych — mindset, trénink a knihy. Zdarma a bez registrace." />

    <!--
      Icons. The SVG favicon is the brand arrow and is byte-identical to the
      newsletter site's app/icon.svg, so a tab reads as THE NEXT LEVEL
      whichever half of the brand it belongs to. Safari will not take an SVG
      for the home-screen icon, hence the 180px raster beside it; both are
      generated from design/og/, see that folder.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Share card. Until 2026-09-19 this page had no og: tags at all, so every
      link to it — in Vít's Instagram bio, in a DM, in the newsletter — showed
      as a bare grey box with a URL under it. The image is a committed raster
      built from design/og/card.html; regenerate with `node design/og/build.mjs`.

      Absolute URL, not /og.png: every scraper rejects a relative og:image.
      This is a single static page on one domain, so the URL is hardcoded
      rather than derived — if the domain ever changes, this line changes with
      it.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="THE NEXT LEVEL" />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:url" content="https://navody.tnextlvl.com/" />
    <meta property="og:title" content="Návody — THE NEXT LEVEL" />
    <meta property="og:description" content="Kompletní knihovna návodů a rad od @vitekfendrych — mindset, trénink a knihy. Zdarma a bez registrace." />
    <meta property="og:image" content="https://navody.tnextlvl.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Všechno, co jsem kdy natočil, na jednom místě." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Návody — THE NEXT LEVEL" />
    <meta name="twitter:description" content="Kompletní knihovna návodů a rad od @vitekfendrych — mindset, trénink a knihy. Zdarma a bez registrace." />
    <meta name="twitter:image" content="https://navody.tnextlvl.com/og.png" />

    <!--
      v4.1 (2026-10-14): the newsletter site's two faces. Inter Tight for
      everything the page says, Instrument Serif italic only for Vít's own
      words (the closing line). The design system's font tokens fall back to
      these family names, which is what lets this site load them from Google
      Fonts instead of next/font. Arial caps and Inter went with v3.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&family=Instrument+Serif:ital@1&display=swap&subset=latin-ext" rel="stylesheet">

    <!--
      `.js` before first paint. Every .reveal is hidden only under `.js`, so a
      script failure leaves the page visible rather than blank.
    -->
    <script>document.documentElement.classList.add('js')</script>

    <!--
      First-party measurement (reel-insights, docs/PLATFORM.md): page views, which
      guide gets opened, outbound clicks. Cookieless: nothing is stored on the
      visitor's device and the server keeps no IP, so no consent banner; the
      newsletter site's privacy policy (section 6) describes it. data-site is a
      public key, not a secret.
    -->
    <script defer src="https://vf-channel-insights.vercel.app/t.js" data-site="nav_39a1a11fbe"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
